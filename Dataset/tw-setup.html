<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HiMeowOS - 毛玻璃卡片 | 渐变模糊过渡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: transparent;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            /* 为了让渐变模糊效果更明显，设置一个微妙的深色背景（可选，不影响穿透） */
            background: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 80%);
        }

        /* 飞入动画：从缩小+透明到原大小完全不透明 */
        @keyframes FlyIn {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 基础卡片容器 (默认样式: 紧凑卡片 300x200) */
        .card-container {
            animation: FlyIn 0.37s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 30px;
            width: 300px;
            height: 200px;
            background-color: rgba(255, 255, 255, 0);
            box-shadow: 0 15px 20px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            position: relative;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            will-change: width, height, border-radius, box-shadow;
            /* 关键: 裁剪溢出内容，保证模糊渐变遮罩只在卡片内部生效 */
            overflow: hidden;
            /* 添加一个极轻微的内边框效果，增强毛玻璃层次 */
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        /* 全屏拓展样式 - 当收到 'fs' 事件时应用 */
        .card-container.fullscreen-mode {
            width: 95vw;
            height: 95vh;
            border-radius: 28px;
            box-shadow: 0 25px 35px rgba(0, 0, 0, 0.25);
        }

        .glass-blur-gradient {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            /* 初始高度覆盖顶部大约60px (确保到title下面区域彻底无模糊，大约从0~56px渐变弱) */
            height: 70px;  
            z-index: 1;
            pointer-events: none;
            /* 核心：使用 backdrop-filter 实现毛玻璃模糊 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            /* 附加半透白背景增强玻璃质感 */
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.1));
            /* 使用 mask 实现从上到下透明度/模糊程度渐变: 
               最顶部完全不透明(显示完全模糊)，到下方20px处开始淡化，大约到50px处完全透明(无模糊效果) 
               这样模糊效果会从强烈 -> 逐渐减弱 -> 消失，符合'最上面20px strong blur，到title下面取消drop特效'
            */
            mask: linear-gradient(to bottom, 
                rgba(0,0,0,1) 0%,      /* 顶部完全应用模糊 */
                rgba(0,0,0,1) 20px,    /* 前20px保持完全模糊 */
                rgba(0,0,0,0.6) 35px,  /* 渐变减弱开始 */
                rgba(0,0,0,0) 55px,    /* 55px之后完全透明，无模糊感，title大约在14px+padding区域，卡片顶部约14~50px区域减弱完成 */
                rgba(0,0,0,0) 100%);
            -webkit-mask: linear-gradient(to bottom, 
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,1) 20px,
                rgba(0,0,0,0.6) 35px,
                rgba(0,0,0,0) 55px,
                rgba(0,0,0,0) 100%);
            transition: all 0.2s ease;
            border-radius: inherit;  /* 继承父级圆角，保证边缘一致 */
        }

        /* 全屏模式下，模糊层高度可能需要微调，但保持同样的渐变逻辑：顶部20px强模糊，到标题下方消失 
           全屏时标题位置变化 (top:18px, 字体稍大)，模糊区域覆盖高度增加到80px确保标题下方无模糊 */
        .card-container.fullscreen-mode .glass-blur-gradient {
            height: 90px;
            mask: linear-gradient(to bottom, 
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,1) 24px,   /* 全屏时顶部24px保持完全模糊 */
                rgba(0,0,0,0.5) 45px,
                rgba(0,0,0,0) 70px,
                rgba(0,0,0,0) 100%);
            -webkit-mask: linear-gradient(to bottom, 
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,1) 24px,
                rgba(0,0,0,0.5) 45px,
                rgba(0,0,0,0) 70px,
                rgba(0,0,0,0) 100%);
            backdrop-filter: blur(14px);
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
        }

        /* 毛玻璃图标 (喵) 置于高层 */
        .glass-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-family: system-ui, 'Segoe UI Emoji', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            pointer-events: none;
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
            z-index: 3; /* 确保在模糊层之上 */
        }

        /* 毛玻璃标题 */
        .glass-title {
            position: absolute;
            top: 14px;
            left: 16px;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 6px 14px;
            font-family: system-ui, 'Segoe UI', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            font-size: 13px;
            font-weight: 520;
            color: rgba(0, 0, 0, 0.85);
            letter-spacing: 0.3px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 0.6px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 3;  /* 置于模糊层之上保持清晰 */
            backdrop-filter: blur(4px); /* 自带轻微背景模糊，提升质感 */
        }

        /* 全屏模式下的微调标题/图标 */
        .card-container.fullscreen-mode .glass-icon {
            width: 42px;
            height: 42px;
            font-size: 24px;
            top: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(6px);
        }

        .card-container.fullscreen-mode .glass-title {
            font-size: 14px;
            padding: 7px 18px;
            top: 18px;
            left: 22px;
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(12px);
            letter-spacing: 0.4px;
        }

        /* 为了更丰富视觉，卡片的底层背景可以增加微妙渐变光晕（提升毛玻璃下的质感） 
           不影响功能，并且所有视觉都在模糊层下方。选择在卡片上直接加一个轻微径向渐变背景 */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, rgba(255,245,210,0.2), rgba(180,210,255,0.1));
            border-radius: inherit;
            pointer-events: none;
            z-index: 0;
        }

        /* 确保容器不拦截鼠标事件 */
        .card-container {
            pointer-events: none;
        }
        /* 但内部所有元素也要保持穿透，不影响底层点击 */
        .card-container * {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card-container" id="dynamicCard">
        <!-- 顶部渐变模糊遮罩层: 实现最上面20px强blur，到标题下面逐渐无drop特效 -->
        <div class="glass-blur-gradient"></div>
        <div class="glass-icon">🐱</div>
        <div class="glass-title">欢迎使用HiMeowOS！</div>
    </div>

    <script>
        (function() {
            const cardElement = document.getElementById('dynamicCard');
            let isFullscreenMode = false;

            // 应用全屏样式 (对应 'fs' 事件)
            function applyFullscreen() {
                if (!cardElement) return;
                if (!isFullscreenMode) {
                    cardElement.classList.add('fullscreen-mode');
                    isFullscreenMode = true;
                    console.log('[HiMeowOS] 已进入全屏模式 (fs)');
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'HiMeowOS', status: 'fullscreen-entered' }, '*');
                        }
                    } catch(e) {}
                }
            }

            // 移除全屏样式，恢复紧凑卡片 (对应 're' 事件)
            function removeFullscreen() {
                if (!cardElement) return;
                if (isFullscreenMode) {
                    cardElement.classList.remove('fullscreen-mode');
                    isFullscreenMode = false;
                    console.log('[HiMeowOS] 已退出全屏模式 (re)');
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'HiMeowOS', status: 'fullscreen-exited' }, '*');
                        }
                    } catch(e) {}
                }
            }

            /**
             * 接收来自父容器的消息
             * 校验来源 + 支持字符串指令 'fs' / 're'
             */
            function handleMessageFromParent(event) {
                if (event.source !== window.parent) return;
                
                const data = event.data;
                if (data == null) return;
                
                // 处理字符串指令
                if (typeof data === 'string') {
                    const trimmed = data.trim().toLowerCase();
                    if (trimmed === 'fs') {
                        applyFullscreen();
                    } else if (trimmed === 're') {
                        removeFullscreen();
                    }
                    return;
                }
                
                // 处理对象格式的指令
                if (typeof data === 'object') {
                    let cmd = null;
                    if (typeof data.command === 'string') cmd = data.command.toLowerCase();
                    else if (typeof data.type === 'string') cmd = data.type.toLowerCase();
                    else if (typeof data.action === 'string') cmd = data.action.toLowerCase();
                    else if (typeof data.event === 'string') cmd = data.event.toLowerCase();
                    
                    if (cmd === 'fs') {
                        applyFullscreen();
                    } else if (cmd === 're') {
                        removeFullscreen();
                    }
                }
            }
            
            window.addEventListener('message', handleMessageFromParent);
            
            // 暴露全局 API
            window.HiMeowOS = {
                enterFullscreen: applyFullscreen,
                exitFullscreen: removeFullscreen,
                isFullscreen: function() { return isFullscreenMode; },
                command: function(cmd) {
                    if (cmd === 'fs') applyFullscreen();
                    else if (cmd === 're') removeFullscreen();
                }
            };
            
            // 通知父容器 iframe 已就绪
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'HiMeowOS', ready: true }, '*');
                }
            } catch(e) {}
            
            console.log('[HiMeowOS] 卡片已就绪，包含顶部渐变模糊层 (模糊过渡从顶部20px强模糊 → title下方逐渐消失)');
        })();
    </script>
</body>
</html>
