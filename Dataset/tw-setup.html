<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HiMeowOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: transparent;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        /* 卡片飞入动画 */
        @keyframes FlyIn {
            0% {
                transform: scale(0.94);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 卡片容器 ———— 完全透明，只有毛玻璃边框 + 内阴影点缀 */
        .card-container {
            animation: FlyIn 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 32px;
            width: 300px;
            height: 200px;
            background-color: transparent;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 0 0 0.5px rgba(255, 255, 255, 0.2) inset;
            pointer-events: none;
            position: relative;
            transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            will-change: width, height, border-radius, box-shadow;
            overflow: hidden;
            border: 0.8px solid rgba(255, 255, 255, 0.35);
            /* 完全透明背景，无任何底色 */
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        /* 全屏模式扩展 */
        .card-container.fullscreen-mode {
            width: 95vw;
            height: 95vh;
            border-radius: 36px;
            box-shadow: 0 28px 45px -18px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.25) inset;
            background-color: transparent;
            border: 0.9px solid rgba(255, 255, 255, 0.4);
        }

        /* ---------- 新组件：顶端毛玻璃标题栏 ---------- */
        .glass-titlebar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            /* 无颜色纯毛玻璃：完全透明底色，只有模糊 + 微白边框 + 轻阴影 */
            background: rgba(255, 255, 255, 0.08);
            /* 极低透明度，几乎没有颜色 */
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 0.6px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            border-radius: 32px 32px 0 0;
            /* 贴合卡片圆角 */
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: all 0.25s ease;
        }

        /* 标题栏内部元素：左图标 + 标题文字（保持原有风格） */
        .titlebar-icon {
            font-size: 18px;
            margin-right: 8px;
            color: rgba(0, 0, 0, 0.7);
            filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.3));
            line-height: 1;
        }

        .titlebar-text {
            font-family: system-ui, 'Segoe UI', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: rgba(0, 0, 0, 0.8);
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 右侧小点缀 (模仿原有玻璃图标，但融入标题栏) */
        .titlebar-extra {
            margin-left: auto;
            font-size: 16px;
            color: rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 2px 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.4);
            font-weight: 400;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 全屏模式下标题栏适配 */
        .card-container.fullscreen-mode .glass-titlebar {
            height: 68px;
            border-radius: 36px 36px 0 0;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 0.7px solid rgba(255, 255, 255, 0.3);
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .card-container.fullscreen-mode .titlebar-text {
            font-size: 18px;
            font-weight: 550;
            color: rgba(0, 0, 0, 0.85);
        }

        .card-container.fullscreen-mode .titlebar-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .card-container.fullscreen-mode .titlebar-extra {
            font-size: 18px;
            padding: 4px 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 0.6px solid rgba(255, 255, 255, 0.5);
        }

        /* 原先独立的玻璃图标 + 标题我们隐藏掉，因为已经整合进标题栏 */
        .glass-icon,
        .glass-title {
            display: none !important;
        }

        /* 额外装饰：让卡片内容区域有一点呼吸感，但保持透明 */
        .card-container::after {
            content: '';
            position: absolute;
            bottom: 18px;
            right: 18px;
            font-size: 32px;
            opacity: 0.08;
            pointer-events: none;
            background: none;
            z-index: 1;
        }

        /* 完全透明，无任何彩色干扰 */
        .card-container,
        .card-container * {
            pointer-events: none;
        }

        /* 保证背景彻底透明 */
        .card-container {
            background: transparent;
        }

        /* 微调毛玻璃下文字可读性 */
        .titlebar-text,
        .titlebar-extra {
            font-weight: 480;
        }

        /* 小尺寸设备 (小于400px) 保持舒适 */
        @media (max-width: 400px) {
            .card-container {
                width: 92vw;
                height: 180px;
            }

            .glass-titlebar {
                height: 48px;
                padding: 0 12px;
            }

            .titlebar-text {
                font-size: 13px;
            }

            .titlebar-icon {
                font-size: 16px;
            }

            .titlebar-extra {
                font-size: 12px;
                padding: 1px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="card-container" id="dynamicCard">
        <!-- 新组件：顶端纯毛玻璃标题栏 (无颜色，只有模糊+光泽) -->
        <div class="glass-titlebar">
            <span class="titlebar-icon">🐱</span>
            <span class="titlebar-text">HiMeowOS</span>
            <span class="titlebar-extra">
                <span>✨</span>
            </span>
        </div>

        <!-- 原先的独立元素已隐藏，保留结构以防万一 -->
        <div class="glass-icon" style="display:none;">🐱</div>
        <div class="glass-title" style="display:none;">欢迎使用 HiMeowOS</div>
    </div>

    <script>
        (function () {
            const cardElement = document.getElementById('dynamicCard');
            let isFullscreenMode = false;

            function applyFullscreen() {
                if (!cardElement) return;
                if (!isFullscreenMode) {
                    cardElement.classList.add('fullscreen-mode');
                    isFullscreenMode = true;
                    console.log('[HiMeowOS·纯净] 进入全屏 (无渐变模糊/无背景色)');
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({
                                type: 'HiMeowOS',
                                status: 'fullscreen-entered',
                                message: '全屏透明卡片已启用'
                            }, '*');
                        }
                    } catch (e) { }
                }
            }

            function removeFullscreen() {
                if (!cardElement) return;
                if (isFullscreenMode) {
                    cardElement.classList.remove('fullscreen-mode');
                    isFullscreenMode = false;
                    console.log('[HiMeowOS·纯净] 退出全屏');
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({
                                type: 'HiMeowOS',
                                status: 'fullscreen-exited',
                                message: '恢复紧凑透明卡片'
                            }, '*');
                        }
                    } catch (e) { }
                }
            }

            function handleMessageFromParent(event) {
                if (event.source !== window.parent) return;
                const data = event.data;
                if (data == null) return;
                if (typeof data === 'string') {
                    const trimmed = data.trim().toLowerCase();
                    if (trimmed === 'fs') {
                        applyFullscreen();
                    } else if (trimmed === 're') {
                        removeFullscreen();
                    }
                    return;
                }
                if (typeof data === 'object') {
                    let cmd = null;
                    if (typeof data.command === 'string') cmd = data.command.toLowerCase();
                    else if (typeof data.type === 'string') cmd = data.type.toLowerCase();
                    else if (typeof data.action === 'string') cmd = data.action.toLowerCase();
                    else if (typeof data.event === 'string') cmd = data.event.toLowerCase();
                    if (cmd === 'fs') {
                        applyFullscreen();
                    } else if (cmd === 're') {
                        removeFullscreen();
                    }
                }
            }

            window.addEventListener('message', handleMessageFromParent);

            window.HiMeowOS = {
                enterFullscreen: applyFullscreen,
                exitFullscreen: removeFullscreen,
                isFullscreen: function () { return isFullscreenMode; },
                command: function (cmd) {
                    if (cmd === 'fs') applyFullscreen();
                    else if (cmd === 're') removeFullscreen();
                }
            };

            setTimeout(() => {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'HiMeowOS',
                            ready: true,
                            description: 'ready'
                        }, '*');
                    }
                } catch (e) { }
            }, 20);
        })();
    </script>
</body>

</html>
