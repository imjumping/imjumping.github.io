<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=yes">
  <title>AomeowOS · 字研操作系统</title>
  <!-- 使用现代字体，兼顾可读性与科技感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b0c14 0%, #1a1c2c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      margin: 0;
      /* 增加细腻的网格背景纹理，提升科技感 */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.06) 0%, transparent 40%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(0,0,0,0.2) 100%);
      position: relative;
    }

    /* 装饰性背景线条，增加动态氛围 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 30px);
      pointer-events: none;
      z-index: 0;
    }

    /* 卡片容器——手机响应式核心 */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      background: rgba(22, 24, 35, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 48px;
      padding: 32px 28px 36px;
      box-shadow: 
        0 30px 50px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -2px 0 rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 轻微悬浮效果，增加交互感（触屏友好） */
    .card:active {
      transform: scale(0.98);
      box-shadow: 
        0 20px 35px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* 操作系统图标区域：活泼的猫爪与电路结合 */
    .logo-wrapper {
      margin-bottom: 28px;
      position: relative;
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #2b1e3a 0%, #1a1f33 100%);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 18px 28px -8px rgba(0,0,0,0.6),
        0 0 0 2px rgba(180, 130, 255, 0.4),
        inset 0 0 18px rgba(180, 100, 255, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .logo-wrapper::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 200, 255, 0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 猫耳与系统图标结合的创意图形 */
    .cat-icon {
      font-size: 54px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
      transform: translateY(-2px);
      background: linear-gradient(180deg, #f5e9ff 0%, #d9b3ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 15px #b77eff;
      letter-spacing: -1px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* 主标题 AomeowOS */
    .os-name {
      font-size: clamp(2.2rem, 10vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #e0d5ff, #c7b3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(160, 120, 255, 0.5);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    /* 副标题：字研操作系统 */
    .subtitle {
      font-size: 1.25rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 20px;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 14px;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-weight: 600;
      color: #f0e6ff;
    }

    /* 分割装饰线 */
    .divider {
      width: 50px;
      height: 4px;
      background: linear-gradient(90deg, #a67cff, #5bc0ff, #a67cff);
      border-radius: 4px;
      margin: 8px 0 20px;
      opacity: 0.8;
      box-shadow: 0 0 14px #8c6eff;
    }

    /* 核心标语：全为Android魔改！ */
    .tagline {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffb86c, #ff7b9c, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 10px 0 18px;
      letter-spacing: 1px;
      line-height: 1.3;
      text-shadow: 0 0 15px rgba(255, 120, 200, 0.6);
      word-break: break-word;
      filter: drop-shadow(0 2px 6px black);
    }

    /* 描述文字区域，增加魔改氛围 */
    .description {
      font-size: 0.95rem;
      color: rgba(220, 215, 240, 0.9);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 28px;
      margin-top: 6px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 500;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .android-badge {
      display: inline-flex;
      align-items: center;
      background: #3ddc84;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-left: 4px;
      letter-spacing: 0.3px;
      box-shadow: 0 0 12px #3ddc84aa;
      text-transform: uppercase;
    }

    .sparkle {
      font-size: 1.1rem;
      margin: 0 2px;
    }

    /* 手机小屏适配微调 */
    @media (max-width: 400px) {
      .card {
        padding: 28px 20px 32px;
        border-radius: 40px;
      }
      .tagline {
        font-size: 1.7rem;
      }
      .os-name {
        font-size: 2.4rem;
      }
    }

    /* 针对极窄设备优化 */
    @media (max-width: 340px) {
      .description {
        font-size: 0.8rem;
        padding: 12px 12px;
      }
    }
  </style>
</head>
<body>
  <!-- 唯一卡片：AomeowOS 字研操作系统～全为Android魔改！ -->
  <div class="card">
    <!-- 猫爪风格系统图标 -->
    <div class="logo-wrapper">
      <span class="cat-icon">🐾</span>
    </div>
    
    <!-- 系统名称 -->
    <h1 class="os-name">AomeowOS</h1>
    
    <!-- 字研操作系统标识 -->
    <div class="subtitle">✨ 字研操作系统 ✨</div>
    
    <!-- 发光分割线 -->
    <div class="divider"></div>
    
    <!-- 核心标语：全为Android魔改 -->
    <div class="tagline">
      全为Android魔改！
    </div>
    
    <!-- 附加氛围描述，强调魔改特质 -->
    <div class="description">
      <span>🔧 深度定制</span>
      <span class="android-badge">Android 内核</span>
      <span>🐾 喵系交互</span>
    </div>
    
    <!-- 微小装饰：波浪线或符号，表达“魔改”的玩味 -->
    <div style="margin-top: 18px; color: rgba(255,255,255,0.5); font-size: 0.8rem; letter-spacing: 2px; display: flex; gap: 12px; align-items: center;">
      <span>〰️</span>
      <span>基于AOSP重构</span>
      <span>〰️</span>
    </div>
  </div>
</body>
</html>
