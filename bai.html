<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯白</title>
    <style>
        /* 强制纯白，杜绝任何透明或默认灰底 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            background: #ffffff;
        }
    </style>
</head>
<body bgcolor="#ffffff" style="background-color:#ffffff; margin:0; padding:0; width:100%; height:100%;">
    <!-- 什么也没有，只有纯白 -->
</body>
</html>
